# Gradle defaults
# 4G because NeoGradle's decompile step is memory-hungry; 2G triggers OOM on some
# hosts without a clear error message.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: configuration-cache is disabled because NeoGradle's runs sometimes
# interact badly with it. Safe to re-enable once confirmed working.
org.gradle.configuration-cache=false

# Parchment mappings — human-readable parameter names
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Minecraft + NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod metadata
mod_id=caero_rings
mod_name=Caero: Ring Biomes
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.caero.rings
mod_authors=Greg
mod_description=Biases biome placement by distance from world origin so easy biomes cluster near spawn, medium biomes in the middle ring, and hard biomes at the edge.
