modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Greg"
description='''
Biases biome placement by nearest-seed Voronoi tiering so hand-placed regions of the
map read as easy / medium / hard difficulty. Wraps vanilla's multi_noise biome source,
so climate-driven variety (via Terralith) and land/ocean shaping (via Continents) both
flow through unchanged.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="required"
    versionRange="[5.9.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[1.1.3,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="encumbered"
    type="required"
    versionRange="[1.0.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="toughasnails"
    type="optional"
    versionRange="[10.1.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="caero_claims"
    type="required"
    versionRange="[0.1.0,)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="caero_specialization"
    type="required"
    versionRange="[0.1.0,)"
    ordering="BEFORE"
    side="BOTH"

[[mixins]]
    config="caero_rings.mixins.json"
