plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
}

kotlin {
    jvmToolchain(21)
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing',
                file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "thedarkcolour:kotlinforforge-neoforge:5.11.0"

    // Numismatics — for BankAccount API. Hard runtime dep, but compile-only here
    // because the runtime instance provides the real jar.
    compileOnly files("libs/CreateNumismatics-1.0.20+neoforge-mc1.21.1.jar")

    // Create — needed for v3 (Create-compat protection hooks).
    compileOnly files("libs/create-1.21.1-6.0.10.jar")

    // Ponder — contains the Catnip rendering library used by Create. We use
    // Catnip's Outliner for through-walls AABB rendering. Extracted from the
    // jarjar bundled inside Create. At runtime Create supplies it transitively.
    compileOnly files("libs/ponder-neoforge-1.0.82+mc1.21.1.jar")

    // Same jars at dev runtime so runClient / runGameTestServer boot correctly.
    localRuntime files("libs/CreateNumismatics-1.0.20+neoforge-mc1.21.1.jar")
    localRuntime files("libs/create-1.21.1-6.0.10.jar")
    // Note: ponder is NOT needed at localRuntime — Create's jarjar injects it.

    // JUnit 5 for pure-Kotlin unit tests.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.3.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '21'
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
